<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Voice Assistant</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 640px;
    margin: 60px auto;
    text-align: center;
    color: #222;
  }
  button {
    font-size: 1.1rem;
    padding: 14px 28px;
    margin: 8px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }
  #micBtn { background: #2563eb; color: white; }
  #micBtn.recording { background: #dc2626; }
  #resetBtn { background: #e5e7eb; color: #222; }
  #status { color: #555; min-height: 1.4em; }
  .turn {
    text-align: left;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 14px 18px;
    margin: 14px 0;
  }
  .turn .label { font-weight: 600; font-size: 0.85rem; color: #666; }
  .timings { font-size: 0.75rem; color: #6b7280; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .actions { font-size: 0.85rem; color: #444; background: #f9fafb; padding: 8px 12px; border-radius: 8px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Voice Assistant</h1>
  <p id="status">Click the mic and speak</p>
  <button id="micBtn">Record</button>
  <button id="resetBtn">Reset conversation</button>
  <audio id="player" hidden></audio>
  <div id="log"></div>

<script>
const micBtn = document.getElementById("micBtn");
const resetBtn = document.getElementById("resetBtn");
const status = document.getElementById("status");
const log = document.getElementById("log");
const player = document.getElementById("player");

let mediaRecorder = null;
let chunks = [];
let recording = false;

function b64ToBlobUrl(b64, mime) {
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: mime }));
}

function el(tag, opts = {}) {
  const node = document.createElement(tag);
  if (opts.className) node.className = opts.className;
  if (opts.text !== undefined) node.textContent = opts.text;
  return node;
}

async function sendAudio(blob) {
  status.textContent = "Thinking...";
  micBtn.disabled = true;
  try {
    await handleTurn(blob);
    status.textContent = "Click the mic and speak";
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
  } finally {
    micBtn.disabled = false;
  }
}

async function handleTurn(blob) {
  const form = new FormData();
  form.append("audio", blob, "input.webm");

  const res = await fetch("/chat", { method: "POST", body: form });
  if (!res.ok) throw new Error(`server returned ${res.status}`);
  const data = await res.json();

  const turn = el("div", { className: "turn" });
  turn.appendChild(el("div", { className: "label", text: "You said" }));
  turn.appendChild(el("div", { text: data.transcript }));

  if (data.actions && data.actions.length) {
    const actionsDiv = el("div", { className: "actions" });
    actionsDiv.appendChild(document.createTextNode("Tools used: "));
    data.actions.forEach((a, i) => {
      if (i > 0) actionsDiv.appendChild(document.createElement("br"));
      actionsDiv.appendChild(el("b", { text: a.tool }));
      actionsDiv.appendChild(document.createTextNode(
        `(${JSON.stringify(a.args)}) -> ${JSON.stringify(a.result)}`
      ));
    });
    turn.appendChild(actionsDiv);
  }

  const replyLabel = el("div", { className: "label", text: "Assistant" });
  replyLabel.style.marginTop = "8px";
  turn.appendChild(replyLabel);
  turn.appendChild(el("div", { text: data.reply }));

  if (data.timings) {
    const t = data.timings;
    const sec = ms => `${(ms / 1000).toFixed(2)}s`;
    const parts = [`ASR ${sec(t.asr_ms)}`, `LLM ${sec(t.llm_ms)} (${t.llm_rounds_ms.length} round${t.llm_rounds_ms.length === 1 ? "" : "s"})`];
    if (t.tools_ms) parts.push(`tools ${sec(t.tools_ms)}`);
    parts.push(`TTS ${sec(t.tts_ms)}`, `total ${sec(t.total_ms)}`);
    turn.appendChild(el("div", { className: "timings", text: parts.join(" · ") }));
  }

  log.prepend(turn);

  if (player.src) URL.revokeObjectURL(player.src);
  player.src = b64ToBlobUrl(data.audio_base64, "audio/wav");
  player.hidden = false;
  try {
    await player.play();
  } catch (err) {
    // Autoplay can be blocked; the visible <audio> controls still let the user play it.
    player.controls = true;
  }
}

micBtn.addEventListener("click", async () => {
  if (!recording) {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      status.textContent = `Microphone unavailable: ${err.message}`;
      return;
    }
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      sendAudio(new Blob(chunks, { type: "audio/webm" }));
    };
    mediaRecorder.start();
    recording = true;
    micBtn.textContent = "Stop";
    micBtn.classList.add("recording");
    status.textContent = "Listening...";
  } else {
    mediaRecorder.stop();
    recording = false;
    micBtn.textContent = "Record";
    micBtn.classList.remove("recording");
  }
});

resetBtn.addEventListener("click", async () => {
  try {
    const res = await fetch("/reset", { method: "POST" });
    if (!res.ok) throw new Error(`server returned ${res.status}`);
  } catch (err) {
    status.textContent = `Reset failed: ${err.message}`;
    return;
  }
  log.replaceChildren();
  status.textContent = "Conversation reset. Click the mic and speak";
});
</script>
</body>
</html>
